version: '3.8'

# 开发环境配置 - 支持热重载
services:
  # 后端服务 - 开发模式
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ipc-cost-backend-dev
    restart: unless-stopped
    environment:
      - APP_ENV=development
      - SECRET_KEY=dev-secret-key
      - STORAGE_TYPE=local
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app:ro
      - ./backend/tests:/app/tests:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - ipc-network-dev

  # 前端服务 - 开发模式
  frontend:
    image: node:20-alpine
    container_name: ipc-cost-frontend-dev
    working_dir: /app
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/v1
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend
    networks:
      - ipc-network-dev

networks:
  ipc-network-dev:
    driver: bridge
